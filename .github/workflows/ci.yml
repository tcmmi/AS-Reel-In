name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # uv as the plugin catalog pins it, exactly.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      # Its own logic, in the standard library: nothing is downloaded.
      - name: Reel In's tests
        run: python3 -B -m unittest test_main.py
      # The lock still matches the script's dependencies.
      - name: Lock is current
        run: uv lock --check --script main.py
